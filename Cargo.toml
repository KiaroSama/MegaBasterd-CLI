[package]
name = "megabasterd-cli"
version = "2.0.0"
edition = "2024"
rust-version = "1.99"
authors = ["Kiaro Sama"]
license = "GPL-3.0-or-later"
description = "A native command-line MEGA.nz transfer client"
repository = "https://github.com/KiaroSama/MegaBasterd-CLI"
autobins = false

[workspace]
members = ["xtask"]
resolver = "3"

[lib]
name = "megabasterd_cli"
path = "src/lib.rs"

[[bin]]
name = "mb"
path = "src/main.rs"

[[bin]]
name = "mbcli"
path = "src/mbcli.rs"

[[bin]]
name = "megabasterd-cli"
path = "src/megabasterd-cli.rs"

[dependencies]
aes = { version = "0.9.3", features = ["zeroize"] }
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
cipher = { version = "0.5.2", features = ["zeroize"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29.0"
ctr = { version = "0.10.1", features = ["zeroize"] }
ctrlc = "3.5.2"
flate2 = "1.1.10"
hex = "0.4.3"
hmac = "0.13.0"
md-5 = "0.11.0"
# Inspect typed causes from reqwest's already-shared HTTP backend, not error text.
hyper = { version = "1.12.0", default-features = false }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "system-config"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
num-bigint = "0.5.1"
pbkdf2 = { version = "0.13.0", features = ["hmac"] }
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "process-group", "job-object", "creation-flags"] }
quick-xml = "0.42.0"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "socks", "json", "form", "query"] }
rpassword = "7.5.4"
scrypt = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "time", "net"] }
url = "2.5.8"
# The public custom transport API may change in minor ureq versions.
ureq = { version = "~3.4.2", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
zeroize = { version = "1.9.1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_System_Console", "Win32_System_IO", "Win32_System_DataExchange", "Win32_System_WindowsProgramming"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = 0
incremental = false

[profile.test]
opt-level = 1

[profile.test.package."*"]
opt-level = 3

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
