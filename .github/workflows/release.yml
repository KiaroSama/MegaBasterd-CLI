name: Native Validation and Build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    uses: ./.github/workflows/ci.yml
    with:
      owner_signing: true
    secrets:
      MBCLI_RELEASE_PFX_BASE64: ${{ secrets.MBCLI_RELEASE_PFX_BASE64 }}
      MBCLI_RELEASE_PFX_PASSWORD: ${{ secrets.MBCLI_RELEASE_PFX_PASSWORD }}
  lint:
    uses: ./.github/workflows/lint.yml
  coverage:
    uses: ./.github/workflows/tests.yml
  dependencies:
    uses: ./.github/workflows/audit.yml
