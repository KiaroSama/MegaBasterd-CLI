name: Coverage
on:
  workflow_call:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      HOOKMAKER_MAX_TEST_WORKERS: 2
      CARGO_BUILD_JOBS: 2
      MEGABASTERD_USER_DIR: ${{ github.workspace }}/.ci-work/runtime space/User
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ac8347dfd92c088cc69f97dd7231c8d7a5d764bd
          path: .ci-work/baseline
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/megabasterd_cli/core/crypter.py
            src/megabasterd_cli/core/upload_identity.py
            src/megabasterd_cli/core/splitter.py
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        id: source-python
        with:
          python-version: '3.13'
      - run: rustup toolchain install 1.99.1 --profile minimal --component llvm-tools-preview --no-self-update
      - run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Download verified media from this commit's native job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-media-${{ github.sha }}
          path: .ci-work/media-transport
      - name: Verify and reuse native Linux media tools
        run: |
          cd .ci-work/media-transport
          sha256sum -c media-linux.tar.gz.sha256
          test "$(tar -tzf media-linux.tar.gz | sort)" = "$(printf 'ffmpeg\nffprobe')"
          mkdir -p ../media/bin
          tar -xzf media-linux.tar.gz -C ../media/bin
      - run: cargo xtask media
      - name: Preserve the 76 percent coverage gate
        env:
          MEGABASTERD_CI_PYTHON: ${{ steps.source-python.outputs.python-path }}
        run: |
          umask 077
          cargo llvm-cov --locked --workspace --all-targets --ignore-filename-regex 'xtask/|tools/|tests/|_tests.rs' --fail-under-lines 76 --lcov --output-path lcov.info -- --test-threads=2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rust-coverage
          path: lcov.info
