name: Coverage
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      HOOKMAKER_MAX_TEST_WORKERS: 2
      CARGO_BUILD_JOBS: 2
      MEGABASTERD_USER_DIR: ${{ github.workspace }}/.ci-work/runtime space/User
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup toolchain install 1.99.1 --profile minimal --component llvm-tools-preview --no-self-update
      - run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - run: cargo xtask media
      - name: Preserve the 76 percent coverage gate
        run: |
          umask 077
          cargo llvm-cov --locked --workspace --all-targets --ignore-filename-regex 'xtask/|tools/|tests/|_tests.rs' --fail-under-lines 76 --lcov --output-path lcov.info -- --test-threads=2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rust-coverage
          path: lcov.info
