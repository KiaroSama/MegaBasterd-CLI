name: Rust CI

on:
  workflow_call:
    inputs:
      owner_signing:
        type: boolean
        required: false
        default: false
    secrets:
      MBCLI_RELEASE_PFX_BASE64:
        required: false
      MBCLI_RELEASE_PFX_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  native:
    name: Build and test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-26-intel
            target: x86_64-apple-darwin
          - os: macos-26
            target: aarch64-apple-darwin
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: 2
      HOOKMAKER_MAX_TEST_WORKERS: 2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout immutable source comparison leaves
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ac8347dfd92c088cc69f97dd7231c8d7a5d764bd
          path: .ci-work/baseline
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/megabasterd_cli/core/crypter.py
            src/megabasterd_cli/core/upload_identity.py
            src/megabasterd_cli/core/splitter.py
      - name: Prepare source-comparison interpreter only
        id: source-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Restore native Cargo cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-${{ matrix.target }}-1.99.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            native-${{ matrix.target }}-1.99.1-${{ hashFiles('Cargo.lock') }}-
            native-${{ matrix.target }}-1.99.1-
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Check actual native architecture
        run: |
          rustc -vV | tee rust-version.txt
          rustc -vV | grep -Fx 'host: ${{ matrix.target }}'
      - name: Verify Apple owner-signing adapter before compilation
        if: runner.os == 'macOS' && inputs.owner_signing
        shell: pwsh
        env:
          MBCLI_RELEASE_PFX_BASE64: ${{ secrets.MBCLI_RELEASE_PFX_BASE64 }}
          MBCLI_RELEASE_PFX_PASSWORD: ${{ secrets.MBCLI_RELEASE_PFX_PASSWORD }}
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP 'owner-signing-preflight'
          New-Item -ItemType Directory -Path $scratch -ErrorAction Stop | Out-Null
          try {
            foreach ($name in @('mb','mbcli','megabasterd-cli')) { Copy-Item /bin/ls (Join-Path $scratch $name) }
            ./.github/scripts/Sign-Release.ps1 -Stage Binaries -Directory $scratch
          } finally { Remove-Item -LiteralPath $scratch -Recurse -Force }
      - name: Build all native release commands
        run: cargo build --locked --release --bins -p megabasterd-cli
      - name: Install media test prerequisites
        run: cargo xtask media
      - name: Bundle verified Linux media tools for coverage reuse
        if: runner.os == 'Linux'
        run: |
          tar -czf .ci-work/media-linux.tar.gz -C .ci-work/media/bin ffmpeg ffprobe
          cd .ci-work
          sha256sum media-linux.tar.gz > media-linux.tar.gz.sha256
      - name: Upload same-commit Linux media tools
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-media-${{ github.sha }}
          path: .ci-work/media-linux.tar.gz*
          if-no-files-found: error
          retention-days: 2
      - name: Run native unit, integration, process and regression tests
        env:
          MEGABASTERD_CI_PYTHON: ${{ steps.source-python.outputs.python-path }}
        run: cargo xtask verify
      - name: Verify Windows embedded release metadata
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/Verify-Metadata.ps1 -Directory target/release -SourceCommit $env:GITHUB_SHA
      - name: Package binaries, source and checksums
        env:
          MBCLI_SIGN_RELEASE: ${{ inputs.owner_signing && '1' || '0' }}
          MBCLI_RELEASE_PFX_BASE64: ${{ secrets.MBCLI_RELEASE_PFX_BASE64 }}
          MBCLI_RELEASE_PFX_PASSWORD: ${{ secrets.MBCLI_RELEASE_PFX_PASSWORD }}
        run: cargo xtask package
      - name: Save native Cargo cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-${{ matrix.target }}-1.99.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
      - name: Upload native build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: megabasterd-cli-${{ matrix.target }}
          path: .ci-work/distribution/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and parity evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-evidence-${{ matrix.target }}
          path: |
            .ci-work/receipt.json
            .ci-work/source-contracts.xml
            .ci-work/resource-report.json
            .ci-work/results/*.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
