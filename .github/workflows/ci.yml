name: Native Rust CI

on:
  workflow_call:
    inputs:
      retirement_approvals:
        description: 'Exact owner-supplied manual dispatch input; never generated by the candidate'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            python: python3
            format: '--format'
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            python: python
            format: ''
          - os: macos-26-intel
            target: x86_64-apple-darwin
            python: python3
            format: ''
          - os: macos-26
            target: aarch64-apple-darwin
            python: python3
            format: ''
    env:
      HOOKMAKER_MAX_TEST_WORKERS: '2'
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout immutable source assertion baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: c4559ecef08c1fb47cc57669230d2f6013520416
          path: .ci-work/source-baseline
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tests/
            /src/megabasterd_cli/core/crypter.py
            /src/megabasterd_cli/core/splitter.py
            /src/megabasterd_cli/core/upload_identity.py
      # Hosted prerequisites: Python >=3.11 (stdlib tomllib), Rustup >=1.29.0.
      # Runner verifies both; Python is CI tooling only and is never packaged.
      - name: Bounded native discovery, lint, tests and binary smoke
        env:
          MEGABASTERD_CI_RETIREMENT_APPROVALS: ${{ inputs.retirement_approvals }}
        shell: bash
        timeout-minutes: 60
        run: >-
          ${{ matrix.python }} -I tools/ci/run-native.py
          --target ${{ matrix.target }} --baseline .ci-work/source-baseline ${{ matrix.format }}
      - name: Preserve exact native assertion receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-evidence-${{ matrix.target }}
          path: .ci-work/evidence/${{ matrix.target }}/receipt.json
          if-no-files-found: error
          retention-days: 7
          overwrite: false
          # Only this exact sanitized receipt is uploaded, not the surrounding work tree.
          include-hidden-files: true
      - name: Preserve representative resource measurements
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-resources-${{ matrix.target }}
          path: .ci-work/resource-report.json
          if-no-files-found: error
          retention-days: 7
          overwrite: false
          include-hidden-files: true

  execution-coverage:
    name: Exact native execution coverage
    needs: native
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      HOOKMAKER_MAX_TEST_WORKERS: '1'
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout immutable assertion baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: c4559ecef08c1fb47cc57669230d2f6013520416
          path: .ci-work/source-baseline
          fetch-depth: 1
          sparse-checkout: tests
      - name: Download this run's native assertion receipts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-evidence-*
          path: .ci-work/native-receipts
          merge-multiple: false
          digest-mismatch: error
      - name: Require exact commit, both macOS architectures and complete assertions
        env:
          MEGABASTERD_CI_RETIREMENT_APPROVALS: ${{ inputs.retirement_approvals }}
        shell: bash
        timeout-minutes: 3
        run: >-
          python3 -I tools/ci/run-native.py --baseline .ci-work/source-baseline
          --aggregate .ci-work/native-receipts
