name: Rust CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Build and test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-26-intel
            target: x86_64-apple-darwin
          - os: macos-26
            target: aarch64-apple-darwin
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: 2
      HOOKMAKER_MAX_TEST_WORKERS: 2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore native Cargo cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-${{ matrix.target }}-1.99.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            native-${{ matrix.target }}-1.99.1-${{ hashFiles('Cargo.lock') }}-
            native-${{ matrix.target }}-1.99.1-
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Check actual native architecture
        run: |
          rustc -vV | tee rust-version.txt
          rustc -vV | grep -Fx 'host: ${{ matrix.target }}'
      - name: Build all native release commands
        run: cargo build --locked --release --bins -p megabasterd-cli
      - name: Install media test prerequisites
        run: cargo xtask media
      - name: Run native unit, integration, process and regression tests
        run: cargo xtask verify
      - name: Package binaries, source and checksums
        run: cargo xtask package
      - name: Save native Cargo cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-${{ matrix.target }}-1.99.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
      - name: Upload native build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: megabasterd-cli-${{ matrix.target }}
          path: .ci-work/distribution/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and parity evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-evidence-${{ matrix.target }}
          path: |
            .ci-work/receipt.json
            .ci-work/source-contracts.xml
            .ci-work/resource-report.json
            .ci-work/results/*.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
