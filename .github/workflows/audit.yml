name: Dependency Audit
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: read
jobs:
  cargo-policy:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny --locked check advisories licenses sources
