name: Native Dependency Audit

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  cargo-policy:
    name: Locked Cargo advisories, licenses and sources
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      HOOKMAKER_MAX_TEST_WORKERS: '2'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bounded pinned full-graph audit
        timeout-minutes: 28
        run: python3 -I tools/ci/dependency_audit.py
