name: Bug report
description: Report a problem with MegaBasterd CLI
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in the details below.

  - type: input
    id: version
    attributes:
      label: Version
      description: "Run `mb --version` and paste the output."
      placeholder: "mb 2.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Other
    validations:
      required: true

  - type: input
    id: rust
    attributes:
      label: Rust toolchain (source builds only)
      description: "For a source build, include `rustc --version`. For a downloaded build, name the CI artifact instead."
      placeholder: "rustc 1.99.1 or megabasterd-cli-x86_64-pc-windows-msvc"

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the bug clearly.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: Exact command you ran and what you expected.
      placeholder: |
        1. mb download "https://mega.nz/file/..."
        2. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "Paste relevant output from `mb -vv …`. Remove passwords, account stores, session data and private link keys before submitting."
      render: shell
